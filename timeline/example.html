<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example page with a timeline</title>
<style>
  /* Stand-in for your own site's styles */
  body { margin: 0; font: 16px/1.6 Georgia, "Times New Roman", serif; color: #222; background: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  p { max-width: 65ch; }
</style>

<!-- 1. Timeline styles -->
<link rel="stylesheet" href="timeline/timeline.css">
</head>
<body>
<main>
  <h1>My site</h1>
  <p>This page stands in for a page on your existing site. The timeline below is added with four lines of HTML; everything else is your own content.</p>

  <!-- 2. Where the timeline appears (optional: data-height="700", data-theme="dark" or "auto") -->
  <div data-timeline></div>

  <p>Text after the timeline continues as normal.</p>
</main>

<!-- 3. Your content, then 4. the timeline script -->
<script src="timeline/timeline-data.js"></script>
<script src="timeline/timeline.js"></script>
</body>
</html>
