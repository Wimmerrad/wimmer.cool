<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timeline Editor</title>
<link rel="stylesheet" href="timeline/timeline.css">
<style>
  :root {
    --bg: #f1f2f0; --surface: #ffffff; --band: #f5f6f4; --ink: #15181b; --ink-2: #4b535a; --muted: #767f87;
    --line: #e2e4e0; --line-strong: #c8ccc8; --hi: #ffd84d; --hi-soft: rgba(255, 216, 77, 0.4); --danger: #b93434;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --ctl-c-ink: #3b4248; --ctl-c-blue: #2a78d6; --ctl-c-orange: #eb6834; --ctl-c-aqua: #1baf7a; --ctl-c-yellow: #eda100;
    --ctl-c-magenta: #e87ba4; --ctl-c-green: #008300; --ctl-c-violet: #4a3aa7; --ctl-c-red: #e34948;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1113; --surface: #181b1e; --band: #1f2326; --ink: #eceeef; --ink-2: #b7bec4; --muted: #8a949c;
      --line: #2a2f33; --line-strong: #3b4247; --hi: #f2c744; --hi-soft: rgba(242, 199, 68, 0.28); --danger: #ec7070;
      --ctl-c-ink: #aab3b9; --ctl-c-blue: #3987e5; --ctl-c-orange: #d95926; --ctl-c-aqua: #199e70; --ctl-c-yellow: #c98500;
      --ctl-c-magenta: #d55181; --ctl-c-green: #2f9a2f; --ctl-c-violet: #9085e9; --ctl-c-red: #e66767;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto minmax(0, 1fr);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* Top bar */
  .ed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .ed-brand { font-weight: 700; letter-spacing: -0.01em; margin-right: 4px; }
  .ed-status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .ed-status.is-dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hi); box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex: none; }
  .ed-bar-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }

  .ed-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .ed-btn:hover:not(:disabled) { border-color: var(--ink-2); background: var(--band); }
  .ed-btn:disabled { opacity: 0.4; cursor: default; }
  .ed-btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
  .ed-btn.primary:hover:not(:disabled) { background: var(--ink-2); border-color: var(--ink-2); }
  .ed-btn.danger { color: var(--danger); }
  .ed-btn.danger.is-armed { background: var(--danger); color: #fff; border-color: var(--danger); }
  .ed-btn.small { height: 28px; padding: 0 9px; font-size: 12.5px; }
  .ed-btn.icon { width: 28px; padding: 0; }
  .ed-link { padding: 0; border: 0; background: none; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
  .ed-link:hover { color: var(--ink); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Layout */
  .ed-main { display: grid; grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); min-height: 0; }
  .ed-side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
  .ed-tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
  .ed-tabs button {
    flex: 1 0 auto; padding: 11px 10px 9px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
    color: var(--ink-2); font-size: 13px;
  }
  .ed-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .ed-pane { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 48px; }
  .ed-preview { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 12px 16px 16px; }
  .ed-preview-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .ed-preview-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); cursor: pointer; }
  #preview { flex: 1 1 auto; min-height: 0; }

  /* Pane content */
  .ed-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .ed-head h2 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
  .ed-head h2 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 4px; }
  .ed-note { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .ed-field { display: grid; gap: 4px; margin-bottom: 12px; }
  .ed-field > span, .ed-legend { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .ed-field small, .ed-hint { font-size: 11.5px; color: var(--muted); }
  .ed-input, .ed-field input:not([type="checkbox"]), .ed-field select, .ed-field textarea, .ed-grid input, .ed-grid select {
    width: 100%; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface);
  }
  .ed-field textarea { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.5; }
  input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
  .ed-check { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; font-size: 13px; cursor: pointer; }
  .ed-grid { display: grid; gap: 6px; grid-template-columns: 1fr 1.2fr 0.8fr; margin-bottom: 6px; }
  .ed-grid label { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); }
  .ed-fieldset { border: 0; padding: 0; margin: 0 0 8px; }
  .ed-section { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ed-section > h3 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  .ed-list { list-style: none; margin: 8px 0 0; padding: 0; }
  .ed-list button {
    display: grid; grid-template-columns: 78px 10px minmax(0, 1fr); align-items: baseline; column-gap: 8px; width: 100%;
    padding: 8px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left;
  }
  .ed-list button:hover { background: var(--band); }
  .ed-list .ed-date { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .ed-list .ed-t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-list .ed-meta { grid-column: 3; font-size: 11.5px; color: var(--muted); }
  .ed-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); align-self: center; }

  .ed-card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--surface); }
  .ed-card-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ed-card-row > select { flex: 1 1 130px; min-width: 0; height: 32px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 0 6px; }
  .ed-card-row > .ed-input { flex: 1 1 120px; }
  .ed-this { font-size: 12.5px; font-weight: 600; padding: 0 4px; white-space: nowrap; }
  .ed-card .ed-input { height: 32px; }
  .ed-card-row + .ed-card-row { margin-top: 6px; }
  .ed-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

  .ed-swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ed-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); cursor: pointer; box-shadow: 0 0 0 1px var(--line-strong); padding: 0; }
  .ed-swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .ed-swatches input[type="color"] { width: 30px; height: 26px; padding: 0 2px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }

  .ed-img { display: grid; grid-template-columns: 68px minmax(0, 1fr) auto; gap: 8px; align-items: start; margin-bottom: 10px; }
  .ed-img img { width: 68px; height: 68px; object-fit: cover; border-radius: 6px; background: var(--band); border: 1px solid var(--line); }
  .ed-img-fields { display: grid; gap: 4px; }
  .ed-img-fields .ed-input { height: 30px; font-size: 13px; }
  .ed-img-btns { display: grid; gap: 4px; }
  .ed-drop {
    display: block; padding: 16px 12px; border: 1.5px dashed var(--line-strong); border-radius: 8px; text-align: center;
    color: var(--ink-2); font-size: 13px; cursor: pointer; background: var(--band);
  }
  .ed-drop:hover, .ed-drop.is-over { border-color: var(--ink); background: var(--hi-soft); color: var(--ink); }
  .ed-drop strong { color: var(--ink); }
  .ed-linkrow { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr) auto; gap: 6px; margin-bottom: 6px; }
  .ed-linkrow .ed-input { height: 32px; }

  .ed-code { position: relative; }
  .ed-code pre { margin: 0; padding: 12px; padding-right: 64px; overflow-x: auto; border-radius: 8px; background: var(--band); border: 1px solid var(--line); font: 12px/1.6 var(--mono); }
  .ed-code .ed-btn { position: absolute; top: 8px; right: 8px; }
  .ed-id code { font-family: var(--mono); font-size: 12px; background: var(--band); padding: 1px 5px; border-radius: 4px; }
  .ed-empty { padding: 20px 8px; text-align: center; color: var(--muted); font-size: 13px; }

  .ed-toast {
    position: fixed; left: 50%; bottom: 18px; z-index: 50; transform: translateX(-50%);
    max-width: min(560px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 8px;
    background: var(--ink); color: var(--surface); font-size: 13px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .ed-toast.is-error { background: var(--danger); color: #fff; }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; }
    .ed-main { grid-template-columns: 1fr; }
    .ed-preview { order: -1; height: 60vh; padding: 10px; }
    .ed-side { border-right: 0; border-top: 1px solid var(--line); }
    .ed-pane { overflow: visible; }
  }
</style>
</head>
<body>
<header class="ed-bar">
  <span class="ed-brand">Timeline editor</span>
  <span class="ed-status" id="status">Example content</span>
  <div class="ed-bar-actions">
    <button type="button" class="ed-btn" id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button type="button" class="ed-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
    <button type="button" class="ed-btn" id="btn-open">Open timeline folder…</button>
    <button type="button" class="ed-btn primary" id="btn-save" title="Save (Ctrl+S)">Save</button>
  </div>
  <input type="file" id="file-open" accept=".js,.json" hidden>
</header>
<div class="ed-main">
  <aside class="ed-side" aria-label="Edit content">
    <nav class="ed-tabs" role="tablist" aria-label="What to edit">
      <button type="button" role="tab" data-tab="points">Points</button>
      <button type="button" role="tab" data-tab="connections">Connections</button>
      <button type="button" role="tab" data-tab="types">Connection kinds</button>
      <button type="button" role="tab" data-tab="lanes">Lines</button>
      <button type="button" role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="ed-pane" id="pane" role="tabpanel"></div>
  </aside>
  <section class="ed-preview" aria-label="Preview">
    <div class="ed-preview-bar">
      <span>Live preview: this is exactly what visitors will see.</span>
      <label><input type="checkbox" id="visitor-view"> Try it as a visitor</label>
    </div>
    <div id="preview"></div>
  </section>
</div>
<div class="ed-toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="timeline/timeline-data.js"></script>
<script src="timeline/timeline.js"></script>
<script>
(function () {
  'use strict';
  var CT = window.ConnectedTimeline;
  var HAS_FS = typeof window.showDirectoryPicker === 'function';
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var STYLES = [['solid', 'Solid line'], ['dashed', 'Dashed'], ['dotted', 'Dotted'], ['dashdot', 'Dash-dot']];

  var S = {
    data: clone(window.TIMELINE_DATA || {}),
    dir: null,               // folder handle (Chrome / Edge)
    imageUrls: new Map(),    // picture path -> object URL for the preview
    pending: new Map(),      // new picture path -> Blob, written on Save
    dirty: false,
    source: window.TIMELINE_DATA ? 'example' : 'empty',
    tab: 'points',
    editing: null,
    filter: '',
    undo: [], redo: [], lastKey: null, lastTime: 0,
    lastType: null
  };
  ensureShape(S.data);

  var $ = function (id) { return document.getElementById(id); };
  var pane = $('pane');

  // ---------- helpers ----------
  function clone(o) { return JSON.parse(JSON.stringify(o || {})); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slug(s) {
    return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'item';
  }
  function uniqueId(base, taken) {
    var s = slug(base), id = s, n = 2;
    while (taken.has(id)) id = s + '-' + n++;
    return id;
  }
  function ids(list) { return new Set(list.map(function (x) { return x.id; })); }
  function ensureShape(d) {
    d.settings = d.settings || {};
    if (!Array.isArray(d.lines) && Array.isArray(d.lanes)) d.lines = d.lanes;   // older data files
    delete d.lanes;
    ['lines', 'types', 'points', 'connections'].forEach(function (k) { if (!Array.isArray(d[k])) d[k] = []; });
    d.points.forEach(function (p) { if (!p.line && p.lane) p.line = p.lane; delete p.lane; });
    if (!d.lines.length) d.lines.push({ id: 'main', label: 'A', name: 'Main line', color: 'blue' });
    if (!d.types.length) d.types.push({ id: 'related', name: 'Related to', color: 'ink', style: 'solid', directed: false });
  }
  function point(id) { return S.data.points.find(function (p) { return p.id === id; }); }
  function sortedPoints() {
    return S.data.points.slice().sort(function (a, b) {
      return dv(a.date) - dv(b.date) || String(a.title || '').localeCompare(String(b.title || ''));
    });
  }
  function dv(s) {
    var p = CT.parseDate(s);
    return p ? p.y + (p.m ? (p.m - 1 + (p.d ? (p.d - 1) / 31 : 0)) / 12 : 0) : Infinity;
  }
  function dateText(p) { return CT.pointDate(p) || 'No date'; }
  function imgUrl(src) {
    if (!src) return '';
    if (S.imageUrls.has(src)) return S.imageUrls.get(src);
    if (/^(data:|blob:|https?:|\/)/i.test(src)) return src;
    return 'timeline/' + src;
  }
  function laneOf(id) { return S.data.lines.find(function (l) { return l.id === id; }) || S.data.lines[0]; }
  function typeOf(id) { return S.data.types.find(function (t) { return t.id === id; }) || S.data.types[0]; }

  var toastT;
  function toast(msg, isError) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.toggle('is-error', !!isError);
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.hidden = true; }, isError ? 7000 : 4200);
  }

  // Two-step confirmation on a button: first click arms it, second click runs.
  function armed(btn, label) {
    if (btn.classList.contains('is-armed')) return true;
    btn.classList.add('is-armed');
    btn.dataset.label = btn.textContent;
    btn.textContent = label || 'Click again to confirm';
    setTimeout(function () {
      if (!btn.isConnected) return;
      btn.classList.remove('is-armed');
      btn.textContent = btn.dataset.label;
    }, 3500);
    return false;
  }

  // ---------- history & saving state ----------
  function mutate(fn, key) {
    var now = Date.now();
    if (!(key && key === S.lastKey && now - S.lastTime < 1500)) {
      S.undo.push(JSON.stringify(S.data));
      if (S.undo.length > 120) S.undo.shift();
      S.redo = [];
    }
    S.lastKey = key || null;
    S.lastTime = now;
    fn(S.data);
    setDirty(true);
    schedulePreview();
  }
  function undo() {
    if (!S.undo.length) return;
    S.redo.push(JSON.stringify(S.data));
    S.data = JSON.parse(S.undo.pop());
    afterHistory();
  }
  function redo() {
    if (!S.redo.length) return;
    S.undo.push(JSON.stringify(S.data));
    S.data = JSON.parse(S.redo.pop());
    afterHistory();
  }
  function afterHistory() {
    S.lastKey = null;
    if (S.editing && !point(S.editing)) S.editing = null;
    setDirty(true);
    updatePreview();
    render();
  }
  function setDirty(v) {
    S.dirty = v;
    var st = $('status'), where = S.dir ? 'Folder “' + S.dir.name + '”' : S.source === 'file' ? 'Opened file' : S.source === 'example' ? 'Example content' : 'New timeline';
    st.textContent = where + (v ? ' · unsaved changes' : ' · saved');
    if (!v && S.source === 'example' && !S.dir) st.textContent = 'Example content';
    st.classList.toggle('is-dirty', v);
    $('btn-undo').disabled = !S.undo.length;
    $('btn-redo').disabled = !S.redo.length;
  }

  // ---------- preview ----------
  var tl = CT.mount($('preview'), S.data, {
    panel: false,
    readHash: false,
    height: '100%',
    resolveImage: function (src) { return S.imageUrls.get(src) || null; },
    onSelect: function (id) { if (id) openPoint(id, true); }
  });
  var previewT;
  function schedulePreview() { clearTimeout(previewT); previewT = setTimeout(updatePreview, 120); }
  function updatePreview() { clearTimeout(previewT); tl.setData(S.data); }

  $('visitor-view').addEventListener('change', function (e) {
    var v = e.target.checked;
    tl.setOptions({ panel: v });
  });

  // ---------- serialising ----------
  function tidy(d) {
    var out = clone(d);
    out.points.forEach(function (p) {
      Object.keys(p).forEach(function (k) {
        var v = p[k];
        if (v === '' || v === false || v == null || (Array.isArray(v) && !v.length)) delete p[k];
      });
      (p.images || []).forEach(function (im) { Object.keys(im).forEach(function (k) { if (im[k] === '') delete im[k]; }); });
    });
    out.connections.forEach(function (c) { if (!c.note) delete c.note; });
    return out;
  }
  function serialize(d) {
    return '/* Timeline content. Edit it with timeline-editor.html, or by hand.\n' +
      '   Dates: "1804", "1945-06" or "1948-06-21" (negative years are BCE).\n' +
      '   Picture paths are relative to this folder. */\n' +
      'window.TIMELINE_DATA = ' + JSON.stringify(tidy(d), null, 2) + ';\n';
  }
  function parseDataFile(text) {
    var a = text.indexOf('{'), b = text.lastIndexOf('}');
    if (a < 0 || b < a) throw new Error('no data');
    var d = JSON.parse(text.slice(a, b + 1));
    if (!d || typeof d !== 'object' || !Array.isArray(d.points)) throw new Error('not timeline data');
    return d;
  }

  // ---------- rendering ----------
  function render() {
    document.querySelectorAll('.ed-tabs [data-tab]').forEach(function (b) {
      b.setAttribute('aria-selected', String(b.dataset.tab === S.tab));
    });
    var scroll = pane.scrollTop;
    if (S.tab === 'points') pane.innerHTML = S.editing && point(S.editing) ? pointForm(point(S.editing)) : pointsList();
    else if (S.tab === 'connections') pane.innerHTML = connectionsPane();
    else if (S.tab === 'types') pane.innerHTML = typesPane();
    else if (S.tab === 'lanes') pane.innerHTML = lanesPane();
    else pane.innerHTML = settingsPane();
    pane.scrollTop = scroll;
    if (S.tab === 'points' && !S.editing) renderPointRows();
  }

  function swatches(attr, id, current) {
    var h = CT.palette.map(function (c) {
      return '<button type="button" class="ed-swatch" data-a="color" ' + attr + '="' + esc(id) + '" data-color="' + c + '" aria-pressed="' + (current === c) +
        '" title="' + c + '" aria-label="' + c + '" style="--c:' + CT.hex(c) + '"></button>';
    }).join('');
    var custom = CT.hex(current);
    return '<div class="ed-swatches">' + h + '<input type="color" data-a="color-custom" ' + attr + '="' + esc(id) + '" value="' + custom + '" title="Custom colour" aria-label="Custom colour"></div>';
  }

  function options(list, value, labelFn) {
    return list.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === value ? ' selected' : '') + '>' + esc(labelFn ? labelFn(x) : x.name) + '</option>';
    }).join('');
  }
  function pointOptions(value, exclude) {
    return sortedPoints().filter(function (p) { return p.id !== exclude; }).map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === value ? ' selected' : '') + '>' + esc(dateText(p) + ' · ' + (p.title || 'Untitled')) + '</option>';
    }).join('');
  }

  // Points list
  function pointsList() {
    return '<div class="ed-head"><h2>Points<small>' + S.data.points.length + '</small></h2>' +
      '<button type="button" class="ed-btn primary small" data-a="add-point">+ Add point</button></div>' +
      (S.source === 'example' ? '<p class="ed-note">You’re looking at the example timeline. Edit it here, or remove the points in Settings to start fresh. Use <strong>Open timeline folder</strong> to work on the copy inside your site.</p>' : '') +
      '<input type="search" class="ed-input" id="pt-filter" placeholder="Find a point" aria-label="Find a point" value="' + esc(S.filter) + '">' +
      '<ul class="ed-list" id="pt-rows"></ul>' +
      '<p class="ed-hint" style="margin-top:14px">Tip: click a station in the preview to edit it. Points on each line are ordered by their date.</p>';
  }
  function renderPointRows() {
    var ul = $('pt-rows');
    if (!ul) return;
    var q = S.filter.trim().toLowerCase();
    var rows = sortedPoints().filter(function (p) {
      return !q || [p.title, p.summary, p.date, p.dateLabel].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    if (!rows.length) {
      ul.innerHTML = '<li class="ed-empty">' + (q ? 'No points match.' : 'No points yet. Add your first one.') + '</li>';
      return;
    }
    ul.innerHTML = rows.map(function (p) {
      var nc = S.data.connections.filter(function (c) { return c.from === p.id || c.to === p.id; }).length;
      var ni = (p.images || []).length, meta = [];
      if (ni) meta.push(ni + (ni === 1 ? ' picture' : ' pictures'));
      if (nc) meta.push(nc + (nc === 1 ? ' connection' : ' connections'));
      return '<li><button type="button" data-a="open-point" data-id="' + esc(p.id) + '">' +
        '<span class="ed-date">' + esc(dateText(p)) + '</span>' +
        '<span class="ed-dot" style="--c:' + CT.hex(laneOf(p.line).color) + '"></span>' +
        '<span class="ed-t">' + esc(p.title || 'Untitled') + '</span>' +
        (meta.length ? '<span class="ed-meta">' + meta.join(' · ') + '</span>' : '') + '</button></li>';
    }).join('');
  }

  // Point form
  function dateInputs(prefix, value, required) {
    var d = CT.parseDate(value) || { y: '', m: 0, d: 0 };
    var months = '<option value="0">—</option>' + MONTHS.map(function (m, i) {
      return '<option value="' + (i + 1) + '"' + (d.m === i + 1 ? ' selected' : '') + '>' + m + '</option>';
    }).join('');
    return '<div class="ed-grid">' +
      '<label>Year' + (required ? '' : ' (optional)') + '<input type="number" step="1" data-f="' + prefix + '.y" value="' + esc(d.y) + '" placeholder="' + (required ? 'e.g. 1969' : '') + '"' + (required ? ' required' : '') + '></label>' +
      '<label>Month<select data-f="' + prefix + '.m">' + months + '</select></label>' +
      '<label>Day<input type="number" min="1" max="31" data-f="' + prefix + '.d" value="' + (d.d || '') + '"></label></div>';
  }

  function pointForm(p) {
    var others = S.data.connections.filter(function (c) { return c.from === p.id || c.to === p.id; });
    var h = '<div class="ed-head"><button type="button" class="ed-link" data-a="back">← All points</button>' +
      '<button type="button" class="ed-btn small" data-a="show-point">Show in preview</button></div>';
    h += '<label class="ed-field"><span>Title</span><input id="f-title" data-f="title" value="' + esc(p.title || '') + '"></label>';
    h += '<fieldset class="ed-fieldset"><legend class="ed-legend">Date</legend>' + dateInputs('date', p.date, true) +
      '<label class="ed-check"><input type="checkbox" data-f="circa"' + (p.circa ? ' checked' : '') + '> Approximate (shows “c.” before the date)</label></fieldset>';
    h += '<fieldset class="ed-fieldset"><legend class="ed-legend">End date <span class="ed-hint">(only for periods, e.g. a war or a career)</span></legend>' + dateInputs('end', p.end, false) + '</fieldset>';
    h += '<label class="ed-field"><span>Text on the line</span><input data-f="dateLabel" value="' + esc(p.dateLabel || '') + '" placeholder="Optional, e.g. “Year 79: The One Year War”"><small>Shown next to the station instead of the plain date. The date above still decides the order of stations.</small></label>';
    h += '<label class="ed-field"><span>Line</span><select data-f="line">' + options(S.data.lines, laneOf(p.line).id, function (l) { return (l.label ? l.label + ' · ' : '') + (l.name || ''); }) + '</select></label>';
    var track = parseInt(p.track, 10) || 0;
    h += '<label class="ed-field"><span>Position</span><select data-f="track">' + [[-2, 'Branch, two levels above'], [-1, 'Branch above the line'], [0, 'On the main line'], [1, 'Branch below the line'], [2, 'Branch, two levels below']].map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === track ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select><small>Stations next to each other on the same branch share one side track, which leaves and rejoins the main line.</small></label>';
    h += '<label class="ed-field"><span>Caption under the station</span><input data-f="caption" value="' + esc(p.caption || '') + '" placeholder="Optional, e.g. “Amuro gets the Gundam”"></label>';
    h += '<label class="ed-field"><span>Short summary</span><textarea rows="2" data-f="summary">' + esc(p.summary || '') + '</textarea></label>';
    h += '<label class="ed-field"><span>Full description</span><textarea rows="6" data-f="description">' + esc(p.description || '') + '</textarea><small>Leave an empty line between paragraphs.</small></label>';

    // Pictures
    h += '<section class="ed-section"><h3>Pictures</h3>';
    (p.images || []).forEach(function (im, i, all) {
      h += '<div class="ed-img"><img src="' + esc(imgUrl(im.src)) + '" alt="">' +
        '<div class="ed-img-fields"><input class="ed-input" data-imf="caption" data-i="' + i + '" value="' + esc(im.caption || '') + '" placeholder="Caption" aria-label="Caption">' +
        '<input class="ed-input" data-imf="credit" data-i="' + i + '" value="' + esc(im.credit || '') + '" placeholder="Credit or source" aria-label="Credit or source"></div>' +
        '<div class="ed-img-btns"><button type="button" class="ed-btn small icon" data-a="img-move" data-i="' + i + '" data-d="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="ed-btn small icon" data-a="img-move" data-i="' + i + '" data-d="1" aria-label="Move down"' + (i === all.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button type="button" class="ed-btn small icon danger" data-a="img-del" data-i="' + i + '" aria-label="Remove picture">✕</button></div></div>';
    });
    if ((p.images || []).length) h += '<label class="ed-check"><input type="checkbox" data-f="mapImage"' + (p.mapImage ? ' checked' : '') + '> Show the first picture on the map instead of the title (good for logos)</label>';
    h += '<label class="ed-drop" id="drop"><input type="file" id="img-input" accept="image/*" multiple hidden>' +
      '<strong>Add pictures</strong>: click, drop files here, or paste. The first picture is shown on the timeline.</label></section>';

    // Links
    h += '<section class="ed-section"><h3>Links <button type="button" class="ed-btn small" data-a="link-add">+ Add link</button></h3>';
    (p.links || []).forEach(function (l, i) {
      h += '<div class="ed-linkrow"><input class="ed-input" data-lf="label" data-i="' + i + '" value="' + esc(l.label || '') + '" placeholder="Link text" aria-label="Link text">' +
        '<input class="ed-input" data-lf="url" data-i="' + i + '" value="' + esc(l.url || '') + '" placeholder="https://…" aria-label="Web address">' +
        '<button type="button" class="ed-btn small icon danger" data-a="link-del" data-i="' + i + '" aria-label="Remove link">✕</button></div>';
    });
    if (!(p.links || []).length) h += '<p class="ed-hint">No links yet.</p>';
    h += '</section>';

    // Tags
    h += '<section class="ed-section"><h3>Tags</h3><label class="ed-field"><input data-f="tags" value="' + esc((p.tags || []).join(', ')) + '" placeholder="Separate with commas" aria-label="Tags"><small>Visitors can find points by searching for a tag.</small></label></section>';

    // Connections
    h += '<section class="ed-section"><h3>Connections <button type="button" class="ed-btn small" data-a="conn-add-here">+ Add connection</button></h3>';
    if (!others.length) h += '<p class="ed-hint">Not connected to anything yet.</p>';
    others.forEach(function (c) {
      var out = c.from === p.id, other = out ? c.to : c.from;
      var typeSel = '<select data-cf="type" data-cid="' + esc(c.id) + '" aria-label="Kind of connection">' + options(S.data.types, c.type) + '</select>';
      var otherSel = '<select data-cf="' + (out ? 'to' : 'from') + '" data-cid="' + esc(c.id) + '" aria-label="Other point">' + pointOptions(other, p.id) + '</select>';
      h += '<div class="ed-card"><div class="ed-card-row">' +
        (out ? '<span class="ed-this">This point</span>' + typeSel + otherSel : otherSel + typeSel + '<span class="ed-this">this point</span>') +
        '</div><div class="ed-card-row"><input class="ed-input" data-cf="note" data-cid="' + esc(c.id) + '" value="' + esc(c.note || '') + '" placeholder="Note (optional, shown on hover)" aria-label="Note">' +
        '<button type="button" class="ed-btn small icon" data-a="conn-swap" data-cid="' + esc(c.id) + '" title="Reverse direction" aria-label="Reverse direction">⇄</button>' +
        '<button type="button" class="ed-btn small icon danger" data-a="conn-del" data-cid="' + esc(c.id) + '" aria-label="Remove connection">✕</button></div></div>';
    });
    h += '</section>';

    // Identity & delete
    h += '<section class="ed-section"><h3>Link to this point</h3><label class="ed-field"><span>Link name</span>' +
      '<input data-f="id" value="' + esc(p.id) + '" pattern="[a-z0-9][a-z0-9-]*"><small>A page link ending in <code>#' + esc(p.id) + '</code> opens this point directly. Letters, numbers and dashes only.</small></label></section>';
    h += '<section class="ed-section"><button type="button" class="ed-btn danger" data-a="point-del">Delete this point</button></section>';
    return h;
  }

  // Connections tab
  function connectionsPane() {
    var d = S.data;
    var h = '<div class="ed-head"><h2>Connections<small>' + d.connections.length + '</small></h2>' +
      '<button type="button" class="ed-btn primary small" data-a="conn-add"' + (d.points.length < 2 ? ' disabled' : '') + '>+ Add connection</button></div>' +
      '<p class="ed-note">Each connection joins two points and has a kind, like “Led to”. Edit the kinds, their colours and line styles in the Connection kinds tab.</p>';
    if (!d.connections.length) h += '<p class="ed-empty">No connections yet.</p>';
    var byDate = function (c) { var p = point(c.from); return p ? dv(p.date) : 0; };
    d.connections.slice().sort(function (a, b) { return byDate(a) - byDate(b); }).forEach(function (c) {
      h += '<div class="ed-card"><div class="ed-card-row"><select data-cf="from" data-cid="' + esc(c.id) + '" aria-label="From">' + pointOptions(c.from) + '</select></div>' +
        '<div class="ed-card-row"><select data-cf="type" data-cid="' + esc(c.id) + '" aria-label="Kind of connection">' + options(d.types, c.type) + '</select>' +
        '<button type="button" class="ed-btn small icon" data-a="conn-swap" data-cid="' + esc(c.id) + '" title="Reverse direction" aria-label="Reverse direction">⇅</button></div>' +
        '<div class="ed-card-row"><select data-cf="to" data-cid="' + esc(c.id) + '" aria-label="To">' + pointOptions(c.to) + '</select></div>' +
        '<div class="ed-card-row"><input class="ed-input" data-cf="note" data-cid="' + esc(c.id) + '" value="' + esc(c.note || '') + '" placeholder="Note (optional)" aria-label="Note">' +
        '<button type="button" class="ed-btn small icon danger" data-a="conn-del" data-cid="' + esc(c.id) + '" aria-label="Remove connection">✕</button></div></div>';
    });
    return h;
  }

  // Connection kinds tab
  function typesPane() {
    var d = S.data;
    var h = '<div class="ed-head"><h2>Connection kinds<small>' + d.types.length + '</small></h2>' +
      '<button type="button" class="ed-btn primary small" data-a="type-add">+ Add kind</button></div>' +
      '<p class="ed-note">Kinds describe how two points relate. Connections between different lines are drawn on the map as links in the kind’s colour and style; all connections are listed in each point’s details.</p>';
    d.types.forEach(function (t) {
      var n = d.connections.filter(function (c) { return c.type === t.id; }).length;
      var id = esc(t.id);
      h += '<div class="ed-card">' +
        '<label class="ed-field"><span>Name</span><input data-tf="name" data-tid="' + id + '" value="' + esc(t.name || '') + '" placeholder="e.g. Influenced"></label>' +
        '<label class="ed-field"' + (t.directed === false ? ' hidden' : '') + '><span>Name seen from the other end</span><input data-tf="inverse" data-tid="' + id + '" value="' + esc(t.inverse || '') + '" placeholder="e.g. Influenced by"></label>' +
        '<div class="ed-field"><span>Colour</span>' + swatches('data-tid', t.id, t.color) + '</div>' +
        '<div class="ed-card-row"><select data-tf="style" data-tid="' + id + '" aria-label="Line style">' + STYLES.map(function (s) {
          return '<option value="' + s[0] + '"' + ((t.style || 'dashed') === s[0] ? ' selected' : '') + '>' + s[1] + '</option>';
        }).join('') + '</select><label class="ed-check" style="margin:0"><input type="checkbox" data-tf="directed" data-tid="' + id + '"' + (t.directed !== false ? ' checked' : '') + '> Arrow (has a direction)</label>' +
        '<span aria-hidden="true">' + CT.kindSample(t) + '</span></div>' +
        '<label class="ed-field" style="margin-top:10px"><span>Description</span><input data-tf="description" data-tid="' + id + '" value="' + esc(t.description || '') + '" placeholder="Optional, shown in the legend tooltip"></label>' +
        '<div class="ed-card-foot"><span>Used by ' + n + (n === 1 ? ' connection' : ' connections') + '</span>' +
        (d.types.length > 1 ? '<button type="button" class="ed-btn small danger" data-a="type-del" data-tid="' + id + '">Delete</button>' : '') + '</div></div>';
    });
    return h;
  }

  // Lines tab
  function lanesPane() {
    var d = S.data;
    var h = '<div class="ed-head"><h2>Lines<small>' + d.lines.length + '</small></h2>' +
      '<button type="button" class="ed-btn primary small" data-a="lane-add">+ Add line</button></div>' +
      '<p class="ed-note">Each line is one era, storyline or thread, drawn like a transit line with its label in a circle at the start. A line can start from a station on a line above it.</p>';
    d.lines.forEach(function (l, i) {
      var n = d.points.filter(function (p) { return laneOf(p.line).id === l.id; }).length;
      var id = esc(l.id);
      var earlier = d.lines.slice(0, i).map(function (x) { return x.id; });
      var startOpts = '<option value="">Its own start, at the left edge</option>' + sortedPoints().filter(function (p) {
        return earlier.indexOf(laneOf(p.line).id) >= 0;
      }).map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (l.start === p.id ? ' selected' : '') + '>Below “' + esc(p.title || 'Untitled') + '” (' + esc(laneOf(p.line).label || '') + ')</option>';
      }).join('');
      h += '<div class="ed-card"><div class="ed-grid" style="grid-template-columns:0.7fr 1.6fr">' +
        '<label>Label in the circle<input data-lnf="label" data-lid="' + id + '" value="' + esc(l.label || '') + '" maxlength="8" placeholder="e.g. U.C."></label>' +
        '<label>Name<input data-lnf="name" data-lid="' + id + '" value="' + esc(l.name || '') + '" placeholder="e.g. Universal Century"></label></div>' +
        '<div class="ed-field" style="margin-top:6px"><span>Colour</span>' + swatches('data-lid', l.id, l.color) + '</div>' +
        '<label class="ed-field"><span>Where the line starts</span><select data-lnf="start" data-lid="' + id + '">' + startOpts + '</select></label>' +
        '<label class="ed-check"><input type="checkbox" data-lnf="continues" data-lid="' + id + '"' + (l.continues !== false ? ' checked' : '') + '> Keep going to the right edge (the story continues)</label>' +
        '<div class="ed-card-foot"><span>' + n + (n === 1 ? ' point' : ' points') + '</span><span class="ed-card-row">' +
        '<button type="button" class="ed-btn small icon" data-a="lane-move" data-lid="' + id + '" data-d="-1" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button type="button" class="ed-btn small icon" data-a="lane-move" data-lid="' + id + '" data-d="1" aria-label="Move down"' + (i === d.lines.length - 1 ? ' disabled' : '') + '>↓</button>' +
        (d.lines.length > 1 ? '<button type="button" class="ed-btn small danger" data-a="lane-del" data-lid="' + id + '">Delete</button>' : '') +
        '</span></div></div>';
    });
    return h;
  }

  // Settings tab
  function settingsPane() {
    var s = S.data.settings;
    var snippet = '<link rel="stylesheet" href="timeline/timeline.css">\n<div data-timeline></div>\n<script src="timeline/timeline-data.js"><\/script>\n<script src="timeline/timeline.js"><\/script>';
    return '<div class="ed-head"><h2>Settings</h2></div>' +
      '<label class="ed-field"><span>Title</span><input data-sf="title" value="' + esc(s.title || '') + '"></label>' +
      '<label class="ed-field"><span>Subtitle</span><textarea rows="2" data-sf="subtitle">' + esc(s.subtitle || '') + '</textarea></label>' +
      '<label class="ed-check"><input type="checkbox" data-sf="showTitle"' + (s.showTitle !== false ? ' checked' : '') + '> Show the title and subtitle above the timeline</label>' +
      '<label class="ed-field"><span>Colours</span><select data-sf="theme">' +
        '<option value="night"' + (s.theme !== 'paper' ? ' selected' : '') + '>Night: bright lines on deep blue</option>' +
        '<option value="paper"' + (s.theme === 'paper' ? ' selected' : '') + '>Paper: lines on a light background</option></select></label>' +
      '<label class="ed-field"><span>Distance between stations (pixels)</span><input type="number" min="140" max="420" step="10" data-sf="spacing" value="' + esc(s.spacing || 210) + '"><small>Increase it if titles or dates get cut short.</small></label>' +
      '<label class="ed-field"><span>View when the page opens</span><select data-sf="view">' +
        '<option value="map"' + (s.view !== 'list' ? ' selected' : '') + '>Map</option>' +
        '<option value="list"' + (s.view === 'list' ? ' selected' : '') + '>List</option></select></label>' +
      '<label class="ed-check"><input type="checkbox" data-sf="fullHeight"' + (s.height === 'full' ? ' checked' : '') + '> Fill the whole browser window (no border, no rounded corners)</label>' +
      '<label class="ed-field"' + (s.height === 'full' ? ' hidden' : '') + '><span>Height on your page (pixels)</span><input type="number" min="380" step="10" data-sf="height" value="' + esc(s.height === 'full' ? 720 : (s.height || 720)) + '"></label>' +
      '<section class="ed-section"><h3>Add the timeline to a page</h3><p class="ed-note">Copy the <code>timeline</code> folder into your site, then paste this where the timeline should appear:</p>' +
      '<div class="ed-code"><pre id="snippet">' + esc(snippet) + '</pre><button type="button" class="ed-btn small" data-a="copy-snippet">Copy</button></div></section>' +
      '<section class="ed-section"><h3>Start over</h3><p class="ed-note">Removes every point and connection but keeps your lines, kinds and settings. You can undo this.</p>' +
      '<button type="button" class="ed-btn danger" data-a="clear-all">Remove all points</button></section>';
  }

  // ---------- actions ----------
  function openPoint(id, fromPreview) {
    if (!point(id)) return;
    S.tab = 'points';
    S.editing = id;
    render();
    pane.scrollTop = 0;
    if (!fromPreview) tl.select(id, { silent: true });
  }

  function addPoint(init) {
    init = init || {};
    var d = S.data, id = uniqueId('new-point', ids(d.points)), last = sortedPoints().slice(-1)[0];
    var lastY = last && CT.parseDate(last.date) ? CT.parseDate(last.date).y + 1 : new Date().getFullYear();
    var date = init.date || String(lastY);
    var line = init.line && d.lines.some(function (l) { return l.id === init.line; }) ? init.line : (last ? laneOf(last.line).id : d.lines[0].id);
    mutate(function (dd) { dd.points.push({ id: id, title: 'New point', date: date, line: line }); });
    updatePreview();
    S.tab = 'points';
    S.editing = id;
    render();
    pane.scrollTop = 0;
    tl.select(id, { silent: true });
    var f = $('f-title');
    if (f) { f.focus(); f.select(); }
  }

  function nextConnId() {
    var n = 0, taken = ids(S.data.connections);
    S.data.connections.forEach(function (c) { var m = /^c(\d+)$/.exec(c.id); if (m) n = Math.max(n, +m[1]); });
    while (taken.has('c' + (n + 1))) n++;
    return 'c' + (n + 1);
  }

  function addConnection(from, to, stay) {
    var d = S.data;
    if (!from || !to || from === to || !point(from) || !point(to)) return;
    var type = S.lastType && d.types.some(function (t) { return t.id === S.lastType; }) ? S.lastType : d.types[0].id;
    if (d.connections.some(function (c) { return c.from === from && c.to === to && c.type === type; })) {
      toast('Those points are already connected that way.');
      return;
    }
    var id = nextConnId();
    mutate(function (dd) { dd.connections.push({ id: id, from: from, to: to, type: type }); });
    updatePreview();
    toast('Connected “' + (point(from).title || 'Untitled') + '” → “' + (point(to).title || 'Untitled') + '” as “' + typeOf(type).name + '”. You can change the kind below.');
    if (!stay) { S.tab = 'points'; S.editing = from; }
    render();
    if (!stay) tl.select(from, { silent: true });
  }

  function renamePoint(oldId, raw, input) {
    var nid = slug(raw);
    if (!raw.trim() || nid === oldId) { if (input) input.value = oldId; return; }
    if (point(nid)) {
      toast('Another point already uses the link name “' + nid + '”.', true);
      if (input) input.value = oldId;
      return;
    }
    mutate(function (d) {
      d.points.forEach(function (p) { if (p.id === oldId) p.id = nid; });
      d.connections.forEach(function (c) { if (c.from === oldId) c.from = nid; if (c.to === oldId) c.to = nid; });
    });
    S.editing = nid;
    updatePreview();
    tl.select(nid, { silent: true });
    var f = pane.querySelector('[data-f="id"]');
    if (f) {
      f.value = nid;
      var code = f.parentNode.querySelector('code');
      if (code) code.textContent = '#' + nid;
    }
  }

  function unusedColor(list) {
    var used = new Set(list.map(function (x) { return x.color; }));
    return CT.palette.find(function (c) { return c !== 'ink' && !used.has(c); }) || 'ink';
  }

  function isTextish(el) {
    return el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && ['checkbox', 'radio', 'file'].indexOf(el.type) < 0);
  }

  function pointField(t, f, committed) {
    var id = S.editing;
    if (!point(id)) return;
    if (f === 'id') { if (committed) renamePoint(id, t.value, t); return; }
    if (f === 'title' && committed) {
      if (/^new-point(-\d+)?$/.test(id) && t.value.trim() && t.value.trim() !== 'New point') renamePoint(id, uniqueId(t.value, ids(S.data.points)), null);
      return;
    }
    if (committed) return;
    if (f.indexOf('.') > 0) {
      var which = f.split('.')[0];
      var yEl = pane.querySelector('[data-f="' + which + '.y"]');
      var y = yEl.value.trim(), m = +pane.querySelector('[data-f="' + which + '.m"]').value, day = pane.querySelector('[data-f="' + which + '.d"]').value.trim();
      var valid = /^-?\d{1,6}$/.test(y);
      if (!valid && (which === 'date' || y || m || day)) { yEl.setAttribute('aria-invalid', 'true'); return; }
      yEl.removeAttribute('aria-invalid');
      var s = valid ? y + (m ? '-' + String(m).padStart(2, '0') + (/^\d{1,2}$/.test(day) ? '-' + String(Math.min(31, Math.max(1, +day))).padStart(2, '0') : '') : '') : '';
      mutate(function (d) {
        var p = d.points.find(function (x) { return x.id === id; });
        if (which === 'date') p.date = s; else if (s) p.end = s; else delete p.end;
      }, 'pt:' + id + ':' + which);
      return;
    }
    mutate(function (d) {
      var p = d.points.find(function (x) { return x.id === id; });
      if (f === 'circa' || f === 'mapImage') { if (t.checked) p[f] = true; else delete p[f]; }
      else if (f === 'track') { var n = parseInt(t.value, 10) || 0; if (n) p.track = n; else delete p.track; }
      else if (f === 'tags') p.tags = t.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      else p[f] = t.value;
    }, 'pt:' + id + ':' + f);
  }

  function onField(t, committed) {
    var f;
    if (t.id === 'pt-filter') { if (!committed) { S.filter = t.value; renderPointRows(); } return; }
    if ((f = t.dataset.f)) { pointField(t, f, committed); return; }
    if (committed && isTextish(t) && t.type !== 'color') return;
    var id = S.editing;
    if ((f = t.dataset.imf)) {
      mutate(function (d) { d.points.find(function (x) { return x.id === id; }).images[+t.dataset.i][f] = t.value; }, 'img:' + id + ':' + t.dataset.i + f);
    } else if ((f = t.dataset.lf)) {
      mutate(function (d) { d.points.find(function (x) { return x.id === id; }).links[+t.dataset.i][f] = t.value; }, 'lnk:' + id + ':' + t.dataset.i + f);
    } else if ((f = t.dataset.cf)) {
      var cid = t.dataset.cid, c = S.data.connections.find(function (x) { return x.id === cid; });
      if (!c) return;
      if (f === 'note') { mutate(function (d) { d.connections.find(function (x) { return x.id === cid; }).note = t.value; }, 'c:' + cid); return; }
      if ((f === 'from' && t.value === c.to) || (f === 'to' && t.value === c.from)) {
        toast('A point can’t be connected to itself.', true);
        render();
        return;
      }
      mutate(function (d) { d.connections.find(function (x) { return x.id === cid; })[f] = t.value; });
      if (f === 'type') S.lastType = t.value;
      render();
    } else if ((f = t.dataset.tf)) {
      var tid = t.dataset.tid;
      mutate(function (d) {
        var ty = d.types.find(function (x) { return x.id === tid; });
        if (f === 'directed') ty.directed = t.checked; else ty[f] = t.value;
      }, 'type:' + tid + ':' + f);
      if (f === 'style' || f === 'directed') render();
    } else if ((f = t.dataset.lnf)) {
      var lid = t.dataset.lid;
      mutate(function (d) {
        var ln = d.lines.find(function (x) { return x.id === lid; });
        if (f === 'continues') { if (t.checked) delete ln.continues; else ln.continues = false; }
        else if (f === 'start') { if (t.value) ln.start = t.value; else delete ln.start; }
        else ln[f] = t.value;
      }, 'lane:' + lid + ':' + f);
    } else if ((f = t.dataset.sf)) {
      mutate(function (d) {
        if (f === 'showTitle') d.settings.showTitle = t.checked;
        else if (f === 'fullHeight') d.settings.height = t.checked ? 'full' : 720;
        else if (f === 'height') { var h = parseInt(t.value, 10); if (h >= 360) d.settings.height = h; }
        else d.settings[f] = t.value;
      }, 'set:' + f);
      if (f === 'view') tl.setView(t.value);
      if (f === 'fullHeight') render();
    } else if (t.dataset.a === 'color-custom') {
      setColor(t, t.value, 'custom');
    }
  }

  function setColor(el, color, key) {
    var tid = el.dataset.tid, lid = el.dataset.lid;
    mutate(function (d) {
      var x = tid ? d.types.find(function (y) { return y.id === tid; }) : d.lines.find(function (y) { return y.id === lid; });
      if (x) x.color = color;
    }, key ? 'color:' + (tid || lid) : null);
    if (!key) render();
  }

  pane.addEventListener('input', function (e) { if (isTextish(e.target)) onField(e.target, false); });
  pane.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'img-input') { addFiles(t.files); t.value = ''; return; }
    onField(t, isTextish(t));
  });

  pane.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]');
    if (!b || b.disabled || b.tagName === 'INPUT') return;
    var a = b.dataset.a, id = S.editing, d = S.data, i = +b.dataset.i;
    var withPoint = function (fn) { mutate(function (dd) { fn(dd.points.find(function (x) { return x.id === id; })); }); updatePreview(); render(); };

    if (a === 'add-point') addPoint({});
    else if (a === 'open-point') openPoint(b.dataset.id);
    else if (a === 'back') { S.editing = null; tl.select(null, { silent: true }); render(); }
    else if (a === 'show-point') tl.select(id, { silent: true });
    else if (a === 'img-move') withPoint(function (p) { var im = p.images.splice(i, 1)[0]; p.images.splice(i + (+b.dataset.d), 0, im); });
    else if (a === 'img-del') withPoint(function (p) { p.images.splice(i, 1); });
    else if (a === 'link-add') {
      withPoint(function (p) { (p.links = p.links || []).push({ label: '', url: '' }); });
      var rows = pane.querySelectorAll('[data-lf="label"]');
      if (rows.length) rows[rows.length - 1].focus();
    }
    else if (a === 'link-del') withPoint(function (p) { p.links.splice(i, 1); });
    else if (a === 'conn-add-here') {
      var list = sortedPoints(), k = list.findIndex(function (p) { return p.id === id; });
      var other = list[k + 1] || list[k - 1];
      if (!other) { toast('Add another point first, then connect them.'); return; }
      addConnection(id, other.id);
    }
    else if (a === 'conn-add') {
      var sp = sortedPoints();
      if (sp.length > 1) addConnection(sp[0].id, sp[1].id, true);
    }
    else if (a === 'conn-swap') {
      mutate(function (dd) { var c = dd.connections.find(function (x) { return x.id === b.dataset.cid; }); var f = c.from; c.from = c.to; c.to = f; });
      updatePreview(); render();
    }
    else if (a === 'conn-del') {
      mutate(function (dd) { dd.connections = dd.connections.filter(function (x) { return x.id !== b.dataset.cid; }); });
      updatePreview(); render();
    }
    else if (a === 'point-del') {
      if (!armed(b, 'Click again to delete')) return;
      var title = point(id).title;
      mutate(function (dd) {
        dd.points = dd.points.filter(function (p) { return p.id !== id; });
        dd.connections = dd.connections.filter(function (c) { return c.from !== id && c.to !== id; });
      });
      S.editing = null;
      updatePreview(); render();
      toast('Deleted “' + (title || 'Untitled') + '”. Press Undo to bring it back.');
    }
    else if (a === 'type-add') {
      var tid = uniqueId('new-kind', ids(d.types));
      mutate(function (dd) { dd.types.push({ id: tid, name: 'New kind', color: unusedColor(dd.types), style: 'dashed', directed: true }); });
      updatePreview(); render();
      var inp = pane.querySelector('[data-tf="name"][data-tid="' + tid + '"]');
      if (inp) { inp.focus(); inp.select(); }
    }
    else if (a === 'type-del') {
      var t = typeOf(b.dataset.tid), rest = d.types.filter(function (x) { return x.id !== t.id; });
      var used = d.connections.filter(function (c) { return c.type === t.id; }).length;
      if (!armed(b, used ? 'Delete? ' + used + ' will become “' + rest[0].name + '”' : 'Click again to delete')) return;
      mutate(function (dd) {
        dd.types = dd.types.filter(function (x) { return x.id !== t.id; });
        dd.connections.forEach(function (c) { if (c.type === t.id) c.type = rest[0].id; });
      });
      updatePreview(); render();
    }
    else if (a === 'lane-add') {
      var lid = uniqueId('new-line', ids(d.lines));
      mutate(function (dd) { dd.lines.push({ id: lid, label: 'NEW', name: 'New line', color: unusedColor(dd.lines) }); });
      updatePreview(); render();
      var li = pane.querySelector('[data-lnf="name"][data-lid="' + lid + '"]');
      if (li) { li.focus(); li.select(); }
    }
    else if (a === 'lane-move') {
      mutate(function (dd) {
        var j = dd.lines.findIndex(function (l) { return l.id === b.dataset.lid; }), l = dd.lines.splice(j, 1)[0];
        dd.lines.splice(j + (+b.dataset.d), 0, l);
      });
      updatePreview(); render();
    }
    else if (a === 'lane-del') {
      var ln = laneOf(b.dataset.lid), others = d.lines.filter(function (x) { return x.id !== ln.id; });
      var cnt = d.points.filter(function (p) { return laneOf(p.line).id === ln.id; }).length;
      if (!armed(b, cnt ? 'Delete? ' + cnt + ' will move to “' + others[0].name + '”' : 'Click again to delete')) return;
      mutate(function (dd) {
        dd.lines = dd.lines.filter(function (x) { return x.id !== ln.id; });
        dd.lines.forEach(function (x) { if (x.start && dd.points.some(function (p) { return p.id === x.start && p.line === ln.id; })) delete x.start; });
        dd.points.forEach(function (p) { if (p.line === ln.id || !p.line) { p.line = others[0].id; delete p.track; } });
      });
      updatePreview(); render();
    }
    else if (a === 'color') setColor(b, b.dataset.color);
    else if (a === 'copy-snippet') {
      var text = $('snippet').textContent;
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents($('snippet'));
        var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        toast('Press Ctrl+C to copy the selected code.');
      };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast('Copied.'); }, fallback); else fallback();
    }
    else if (a === 'clear-all') {
      if (!armed(b, 'Click again to remove everything')) return;
      mutate(function (dd) { dd.points = []; dd.connections = []; });
      S.editing = null;
      updatePreview(); render();
      toast('All points removed. Press Undo if that was a mistake.');
    }
  });

  document.querySelector('.ed-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    S.tab = b.dataset.tab;
    render();
    pane.scrollTop = 0;
  });

  // ---------- pictures ----------
  function extFor(type, name) {
    var map = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'image/avif': 'avif' };
    if (map[type]) return map[type];
    var m = /\.([a-z0-9]+)$/i.exec(name || '');
    return m ? m[1].toLowerCase() : 'jpg';
  }

  // Large photos are resized to 1600px and compressed so your site stays fast.
  function prepareImage(file) {
    var type = file.type || '', ext = extFor(type, file.name);
    if (/svg|gif/.test(type) || (file.size <= 400 * 1024 && /png|jpeg|webp|avif/.test(type))) return Promise.resolve({ blob: file, ext: ext });
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d'), alpha = /png|webp|avif/.test(type);
        if (!alpha) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
        ctx.drawImage(img, 0, 0, w, h);
        var out = alpha ? 'image/webp' : 'image/jpeg';
        c.toBlob(function (b) {
          if (b && b.type === out) { resolve({ blob: b, ext: alpha ? 'webp' : 'jpg' }); return; }
          c.toBlob(function (b2) { if (b2) resolve({ blob: b2, ext: 'png' }); else reject(new Error('encode')); }, 'image/png');
        }, out, 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
      img.src = url;
    });
  }

  function blobToDataURL(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function uniqueFileName(base, ext) {
    var taken = new Set(S.pending.keys());
    S.imageUrls.forEach(function (u, k) { taken.add(k); });
    S.data.points.forEach(function (p) { (p.images || []).forEach(function (im) { taken.add(im.src); }); });
    var name = base + '.' + ext, n = 2;
    while (taken.has('images/' + name)) name = base + '-' + n++ + '.' + ext;
    return name;
  }

  async function addFiles(fileList) {
    var id = S.editing;
    if (!id || !point(id)) return;
    var files = Array.from(fileList || []).filter(function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|svg|avif)$/i.test(f.name);
    });
    if (!files.length) { toast('Those files aren’t pictures. Use JPG, PNG, GIF, WebP or SVG.', true); return; }
    var added = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        var r = await prepareImage(f), src;
        if (HAS_FS) {
          src = 'images/' + uniqueFileName(slug(f.name.replace(/\.[^.]+$/, '')), r.ext);
          S.pending.set(src, r.blob);
          S.imageUrls.set(src, URL.createObjectURL(r.blob));
        } else {
          src = await blobToDataURL(r.blob);
        }
        added.push({ src: src, caption: '' });
      } catch (err) {
        toast('Couldn’t read “' + f.name + '”. Save it as a JPG or PNG and try again.', true);
      }
    }
    if (!added.length || !point(id)) return;
    mutate(function (d) { var p = d.points.find(function (x) { return x.id === id; }); p.images = (p.images || []).concat(added); });
    updatePreview();
    render();
    toast((added.length === 1 ? 'Picture added.' : added.length + ' pictures added.') + (HAS_FS ? ' It’s copied into your timeline’s images folder when you save.' : ''));
  }

  pane.addEventListener('dragover', function (e) {
    if (!S.editing || !e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') < 0) return;
    e.preventDefault();
    var z = $('drop');
    if (z) z.classList.add('is-over');
  });
  pane.addEventListener('dragleave', function (e) {
    var z = $('drop');
    if (z && !pane.contains(e.relatedTarget)) z.classList.remove('is-over');
  });
  pane.addEventListener('drop', function (e) {
    if (!S.editing || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    var z = $('drop');
    if (z) z.classList.remove('is-over');
    addFiles(e.dataTransfer.files);
  });
  document.addEventListener('paste', function (e) {
    if (S.tab !== 'points' || !S.editing || !e.clipboardData) return;
    var files = Array.from(e.clipboardData.files || []).filter(function (f) { return /^image\//.test(f.type); });
    if (!files.length) return;
    e.preventDefault();
    addFiles(files);
  });

  // ---------- open & save ----------
  function loadData(data, source) {
    ensureShape(data);
    S.data = data;
    S.source = source;
    S.undo = []; S.redo = [];
    S.editing = null;
    S.filter = '';
    setDirty(false);
    tl.setData(S.data, { fit: true });
    render();
  }

  async function openFolder() {
    var dir;
    try { dir = await window.showDirectoryPicker({ id: 'timeline', mode: 'readwrite' }); }
    catch (e) { return; }
    var fh;
    try { fh = await dir.getFileHandle('timeline-data.js'); }
    catch (e) {
      try { dir = await dir.getDirectoryHandle('timeline'); fh = await dir.getFileHandle('timeline-data.js'); }
      catch (e2) { toast('There’s no timeline-data.js in that folder. Pick the “timeline” folder inside your site, the one that holds timeline.js.', true); return; }
    }
    var data;
    try { data = parseDataFile(await (await fh.getFile()).text()); }
    catch (e) { toast('Couldn’t read timeline-data.js. It must hold plain JSON after “window.TIMELINE_DATA =”.', true); return; }
    S.imageUrls.forEach(function (u) { if (u.indexOf('blob:') === 0) URL.revokeObjectURL(u); });
    S.imageUrls.clear();
    S.pending.clear();
    try {
      var imgs = await dir.getDirectoryHandle('images');
      for await (var h of imgs.values()) {
        if (h.kind === 'file') S.imageUrls.set('images/' + h.name, URL.createObjectURL(await h.getFile()));
      }
    } catch (e) { /* no images folder yet */ }
    S.dir = dir;
    loadData(data, 'folder');
    toast('Opened “' + dir.name + '” with ' + data.points.length + (data.points.length === 1 ? ' point.' : ' points.'));
  }

  async function writeFile(dir, name, content) {
    var fh = await dir.getFileHandle(name, { create: true });
    var w = await fh.createWritable();
    await w.write(content);
    await w.close();
  }

  async function save() {
    if (!HAS_FS) {
      var url = URL.createObjectURL(new Blob([serialize(S.data)], { type: 'text/javascript' }));
      var a = document.createElement('a');
      a.href = url; a.download = 'timeline-data.js';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      setDirty(false);
      toast('Downloaded timeline-data.js. Put it in your site’s timeline folder, replacing the old one.');
      return;
    }
    if (!S.dir) {
      var dir;
      try { dir = await window.showDirectoryPicker({ id: 'timeline', mode: 'readwrite' }); }
      catch (e) { return; }
      try { var sub = await dir.getDirectoryHandle('timeline'); await sub.getFileHandle('timeline.js'); dir = sub; } catch (e) { /* use as picked */ }
      S.dir = dir;
    }
    try {
      if (S.pending.size) {
        var imgDir = await S.dir.getDirectoryHandle('images', { create: true });
        for (var entry of S.pending) await writeFile(imgDir, entry[0].replace(/^images\//, ''), entry[1]);
        S.pending.clear();
      }
      await writeFile(S.dir, 'timeline-data.js', serialize(S.data));
      if (S.source === 'example') S.source = 'folder';
      setDirty(false);
      var hasScript = true;
      try { await S.dir.getFileHandle('timeline.js'); } catch (e) { hasScript = false; }
      toast(hasScript
        ? 'Saved to “' + S.dir.name + '”. Reload your site to see the changes.'
        : 'Saved to “' + S.dir.name + '”. That folder has no timeline.js yet, so copy timeline.js and timeline.css into it too.');
    } catch (e) {
      if (e && e.name === 'NotAllowedError') toast('Saving was blocked. Allow the editor to change files in that folder, then save again.', true);
      else toast('Couldn’t save: ' + (e && e.message ? e.message : 'unknown error') + '.', true);
    }
  }

  $('btn-open').addEventListener('click', function () {
    if (S.dirty && !armed(this, 'Discard unsaved changes?')) return;
    if (HAS_FS) openFolder(); else $('file-open').click();
  });
  $('file-open').addEventListener('change', async function () {
    var f = this.files[0];
    this.value = '';
    if (!f) return;
    try {
      loadData(parseDataFile(await f.text()), 'file');
      toast('Opened ' + f.name + '. Pictures appear if this editor sits next to your timeline folder.');
    } catch (e) {
      toast('Couldn’t read that file. Choose the timeline-data.js from your site’s timeline folder.', true);
    }
  });
  $('btn-save').addEventListener('click', save);
  $('btn-undo').addEventListener('click', undo);
  $('btn-redo').addEventListener('click', redo);

  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    var k = e.key.toLowerCase(), t = e.target;
    if (k === 's') { e.preventDefault(); save(); return; }
    if (k !== 'z' && k !== 'y') return;
    if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && isTextish(t)))) return; // let the text box undo its own typing
    e.preventDefault();
    if (k === 'y' || e.shiftKey) redo(); else undo();
  });

  window.addEventListener('beforeunload', function (e) {
    if (!S.dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  // ---------- start ----------
  if (!HAS_FS) {
    $('btn-open').textContent = 'Open timeline-data.js…';
    $('btn-save').textContent = 'Download timeline-data.js';
  }
  setDirty(false);
  render();
})();
</script>
</body>
